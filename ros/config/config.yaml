# NOTE: Please note that this is just an example of the advanced configuration for the KISS-ICP
# pipeline and it's not really meant to use for any particular dataset, is just to expose other
# options that are disabled by default

kiss_icp_node:
  ros__parameters:
    use_imu_prediction: false # Generic default; G1 mapping/localization enable scan-time IMU rotation.
    gravity_align_output: false # Enable with scan-time IMU for a gravity-aligned odometry world.
    inertial_prediction:
      enabled: false # G1 profile enables acceleration/bias prediction for weak geometry.
      acceleration_noise: 0.2
      bias_walk: 0.005
      position_noise: 0.02
      max_sample_gap: 0.05
      imu_wait_timeout: 0.06 # Wait for the upper scan-time IMU sample before ICP.
      gravity_magnitude: 9.806
    use_leg_prediction: false # Optional leg translation seed; independent of fusion factors.
    ####    /!\ If you set these ROS-related parameters in the file, they will overwrite the corresponding launch arguments   ####

    # base_frame: ""
    # lidar_odom_frame: "odom_lidar"
    # publish_odom_tf: True
    # invert_odom_tf: True
    # position_covariance: 0.1
    # orientation_covariance: 0.1

    ####    Core KISS-ICP parameters    ####

    data:
      deskew: True
      max_range: 20.0
      min_range: 0.3

    mapping:
      voxel_size: 0.05
      max_points_per_voxel: 20

    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1

    registration:
      metric: point_to_point # G1 overrides select surface registration.
      normal_neighbors: 10
      normal_radius: 1.2 # metres, single-scan normal support
      planarity_ratio: 0.15 # smallest / second covariance eigenvalue
      eigenvalue_ratio: 0.0001 # project out unobservable normal-equation directions
      covariance_regularization: 0.01 # GICP mode only; not used by hybrid.
      translation_eigenvalue_ratio: 0.02 # Hybrid translation observability threshold.
      max_num_iterations: 500 # <- optional
      convergence_criterion: 0.0001 # <- optional
      max_num_threads: 0 # <- optional, 0 means automatic
    quality:
      enabled: false             # Generic KISS behavior; G1 localization enables the gate.
      min_inlier_ratio: 0.08     # Fraction of current points matching the local voxel map.
      max_inlier_rmse: 0.25      # Maximum matched-point RMSE, metres.
      inlier_distance: 0.30     # Maximum distance defining a match, metres.
      max_prior_translation: 0.60 # Maximum ICP translation from motion seed, metres.
      max_prior_rotation: 0.20  # Maximum ICP rotation from motion seed, radians.
      reseed_after_rejection_seconds: 1.5 # Rebuild stale local voxels after sustained height-only rejection when leg odometry is available.
